[project]
name = "ai-trip-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sanchit Kumar", email = "sanchit.kr007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-google-community>=5.1.1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-trip-planner = "ai_trip_planner:main"

[tool.uv.build-backend]
module-name = [
    "ai_trip_planner",
    "agent",
    "config",
    "exception",
    "logger",
    "prompt_library",
    "tools",
    "utils",
]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
